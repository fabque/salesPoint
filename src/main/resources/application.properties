spring.application.name=sales.point


# H2 datasource (in-memory) (SalePoint and SalePointCost)
app.datasource.h2.url=jdbc:h2:mem:salepointdb;DB_CLOSE_DELAY=-1
app.datasource.h2.username=sa
app.datasource.h2.password=sa
app.datasource.h2.driver-class-name=org.h2.Driver
app.datasource.h2.hibernate.dialect=org.hibernate.dialect.H2Dialect
app.datasource.h2.hibernate.hbm2ddl=create-drop

# Postgres (Accreditation)
app.datasource.postgres.url=jdbc:postgresql://localhost:5432/salespoint
app.datasource.postgres.username=usr_salespoint
app.datasource.postgres.password=S4lesp01nt
app.datasource.postgres.driver-class-name=org.postgresql.Driver
app.datasource.postgres.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
app.datasource.postgres.hibernate.hbm2ddl=update
app.datasource.postgres.hibernate.jdbc.time_zone=UTC

# Global property for Hibernate timezone (option A)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Enable the H2 console for debugging (http://localhost:8080/h2-console when app is running)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.api.version=v1
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
openapi30-modulename=sales.point
openapi30-apiversion=${server.api.version}

spring.redis.host=localhost
spring.redis.port=6379
spring.cache.type=redis
